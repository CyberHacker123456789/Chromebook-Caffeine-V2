<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_CAFFEINE_v5.4</title>
    <style>
        :root { --main-green: #00ff41; --bg-black: #0d0d0d; }
        body {
            background-color: var(--bg-black);
            color: var(--main-green);
            font-family: 'Courier New', Courier, monospace;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; margin: 0; overflow: hidden;
        }
        #main-ui { text-align: center; border: 1px solid var(--main-green); padding: 30px; box-shadow: 0 0 15px var(--main-green); }
        .btn {
            background: transparent; color: var(--main-green); border: 1px solid var(--main-green);
            padding: 12px 20px; font-size: 0.9rem; cursor: pointer; margin: 10px;
        }
        .btn:hover { background: var(--main-green); color: var(--bg-black); }
        #log {
            margin-top: 15px; font-size: 0.7rem; height: 100px; overflow-y: auto;
            text-align: left; border-top: 1px solid var(--main-green); padding-top: 10px;
        }
        #caffeineVid { width: 1px; height: 1px; position: absolute; bottom: 0; opacity: 0.01; }
        /* Keep the source image hidden on the main dashboard */
        #wizardSource { display: none; }
    </style>
</head>
<body>

    <!-- Load the wizard image (make sure wizard.png is in the same folder) -->
    <img id="wizardSource" src="wizard.png" alt="Wizard">

    <div id="main-ui">
        <h3>CAFFEINE_SYSTEM_v5.4</h3>
        <p>CORE: <span id="status" style="color: orange;">IDLE</span></p>
        <p>UPTIME: <span id="timer">00:00:00</span></p>
        
        <button class="btn" id="startBtn">START CORE</button>
        <button class="btn" id="pipBtn">FLOATING MODE</button>
        
        <video id="caffeineVid" loop playsinline muted></video>
        <div id="log"></div>
    </div>

    <script>
        const startBtn = document.getElementById('startBtn');
        const pipBtn = document.getElementById('pipBtn');
        const vid = document.getElementById('caffeineVid');
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');
        const timerEl = document.getElementById('timer');
        const imgSource = document.getElementById('wizardSource');

        let wakeLock = null;
        let startTime = null;
        let timerInterval = null;
        let heartbeatInterval = null;

        function getHeartbeatStream() {
            if (heartbeatInterval) clearInterval(heartbeatInterval);
            
            const canvas = document.createElement('canvas');
            // Setting a canvas resolution optimized for a portrait wizard layout
            canvas.width = 450; 
            canvas.height = 550;
            const ctx = canvas.getContext('2d');
            
            heartbeatInterval = setInterval(() => {
                // 1. Draw solid background
                ctx.fillStyle = '#ffffff'; 
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                
                // 2. Draw the wizard image if loaded
                if (imgSource.complete && imgSource.naturalWidth !== 0) {
                    // Centers and scales image neatly onto the canvas
                    ctx.drawImage(imgSource, 0, 0, canvas.width, canvas.height - 50);
                } else {
                    // Fallback text if the image file is missing or still loading
                    ctx.fillStyle = '#0d0d0d';
                    ctx.font = '16px Courier New';
                    ctx.fillText("[ Summoning Wizard... ]", 110, 250);
                }
                
                // 3. Render your custom text banner at the bottom
                ctx.fillStyle = '#0d0d0d';
                ctx.fillRect(0, canvas.height - 50, canvas.width, 50);
                
                ctx.fillStyle = '#00ff41'; // Matrix green text matching your theme
                ctx.font = 'bold 18px Courier New';
                ctx.textAlign = 'center';
                ctx.fillText("don't be gone too long", canvas.width / 2, canvas.height - 20);
                
            }, 500);
            return canvas.captureStream(10); 
        }

        async function requestWakeLock() {
            if ('wakeLock' in navigator) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    addLog("WakeLock: GRANTED");
                } catch (e) {
                    addLog("WakeLock: DENIED (Admin Block)");
                }
            } else {
                addLog("WakeLock: NOT SUPPORTED");
            }
        }

        async function start() {
            addLog("Attempting Startup...");
            
            startTime = Date.now();
            statusEl.innerText = "ACTIVE";
            statusEl.style.color = "var(--main-green)";
            
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(updateTimer, 1000);

            try {
                vid.srcObject = getHeartbeatStream();
                await vid.play();
                addLog("Wizard Stream: ONLINE");
            } catch (e) {
                addLog("Wizard Stream: FAILED");
            }

            await requestWakeLock();
        }

        function updateTimer() {
            const elapsed = Math.floor((Date.now() - startTime) / 1000);
            const h = Math.floor(elapsed / 3600).toString().padStart(2, '0');
            const m = Math.floor((elapsed % 3600) / 60).toString().padStart(2, '0');
            const s = (elapsed % 60).toString().padStart(2, '0');
            timerEl.innerText = `${h}:${m}:${s}`;
        }

        async function enterPiP() {
            try {
                if (vid.srcObject) {
                    await vid.requestPictureInPicture();
                    addLog("PIP: ACTIVE");
                } else {
                    addLog("PIP: Error (Start Core first)");
                }
            } catch (e) {
                addLog("PIP: System Blocked.");
            }
        }

        function addLog(msg) {
            const d = document.createElement('div');
            d.innerText = `> ${msg}`;
            logEl.prepend(d);
        }

        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && statusEl.innerText === "ACTIVE") {
                await requestWakeLock();
            }
        });

        startBtn.onclick = start;
        pipBtn.onclick = enterPiP;
    </script>
</body>
</html>
